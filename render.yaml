services:
  - type: web
    name: opencli
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: OPENCLI_GATEWAY_PORT
        value: "8080"
      - key: OPENCLI_STATE_DIR
        value: /data/.opencli
      - key: OPENCLI_WORKSPACE_DIR
        value: /data/workspace
      - key: OPENCLI_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: opencli-data
      mountPath: /data
      sizeGB: 1
