name: OpenCLI
options:
  bundleIdPrefix: ai.opencli
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  OpenCLIKit:
    path: ../shared/OpenCLIKit
  Swabble:
    path: ../../Swabble

schemes:
  OpenCLI:
    shared: true
    build:
      targets:
        OpenCLI: all
    test:
      targets:
        - OpenCLITests
        - OpenCLILogicTests
  OpenCLILogicTests:
    shared: true
    build:
      targets:
        OpenCLILogicTests: all
    test:
      targets:
        - OpenCLILogicTests

targets:
  OpenCLI:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
    dependencies:
      - target: OpenCLIShareExtension
        embed: true
      - target: OpenCLIActivityWidget
        embed: true
      - target: OpenCLIWatchApp
      - package: OpenCLIKit
      - package: OpenCLIKit
        product: OpenCLIChatUI
      - package: OpenCLIKit
        product: OpenCLIProtocol
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftformat >/dev/null 2>&1; then
            echo "error: swiftformat not found (brew install swiftformat)" >&2
            exit 1
          fi
          swiftformat --lint --config "$SRCROOT/../../.swiftformat" \
            --unexclude "$SRCROOT/Sources,$SRCROOT/ShareExtension,$SRCROOT/ActivityWidget,$SRCROOT/WatchExtension,$SRCROOT/../shared/OpenCLIKit,$SRCROOT/../../Swabble" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "error: swiftlint not found (brew install swiftlint)" >&2
            exit 1
          fi
          swiftlint lint --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Sources/OpenCLI.entitlements
        CODE_SIGN_STYLE: "$(OPENCLI_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(OPENCLI_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENCLI_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(OPENCLI_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          OPENCLI_PUSH_TRANSPORT: direct
          OPENCLI_PUSH_DISTRIBUTION: local
          OPENCLI_PUSH_RELAY_BASE_URL: ""
          OPENCLI_PUSH_APNS_ENVIRONMENT: sandbox
        Release:
          OPENCLI_PUSH_TRANSPORT: direct
          OPENCLI_PUSH_DISTRIBUTION: local
          OPENCLI_PUSH_RELAY_BASE_URL: ""
          OPENCLI_PUSH_APNS_ENVIRONMENT: production
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: OpenCLI
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: ai.opencli.ios
            CFBundleURLSchemes:
              - opencli
        CFBundleShortVersionString: "$(OPENCLI_MARKETING_VERSION)"
        OpenCLICanonicalVersion: "$(OPENCLI_IOS_VERSION)"
        CFBundleVersion: "$(OPENCLI_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - ai.opencli.ios.bgrefresh
        NSLocalNetworkUsageDescription: OpenCLI discovers and connects to your OpenCLI gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSBonjourServices:
          - _opencli-gw._tcp
        NSCameraUsageDescription: OpenCLI can capture photos or short video clips when requested via the gateway.
        NSLocationWhenInUseUsageDescription: OpenCLI uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: OpenCLI can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: OpenCLI needs microphone access for voice wake.
        NSMotionUsageDescription: OpenCLI may use motion data to support device-aware interactions and automations.
        NSPhotoLibraryUsageDescription: OpenCLI needs photo library access when you choose existing photos to share with your assistant.
        NSSpeechRecognitionUsageDescription: OpenCLI uses on-device speech recognition for voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        OpenCLIPushTransport: "$(OPENCLI_PUSH_TRANSPORT)"
        OpenCLIPushDistribution: "$(OPENCLI_PUSH_DISTRIBUTION)"
        OpenCLIPushRelayBaseURL: "$(OPENCLI_PUSH_RELAY_BASE_URL)"
        OpenCLIPushAPNsEnvironment: "$(OPENCLI_PUSH_APNS_ENVIRONMENT)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  OpenCLIShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
    dependencies:
      - package: OpenCLIKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(OPENCLI_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(OPENCLI_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENCLI_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(OPENCLI_SHARE_PROFILE)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: OpenCLI Share
        CFBundleShortVersionString: "$(OPENCLI_MARKETING_VERSION)"
        CFBundleVersion: "$(OPENCLI_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  OpenCLIActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/OpenCLIActivityAttributes.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(OPENCLI_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(OPENCLI_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENCLI_ACTIVITY_WIDGET_BUNDLE_ID)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: OpenCLI Activity
        CFBundleShortVersionString: "$(OPENCLI_MARKETING_VERSION)"
        CFBundleVersion: "$(OPENCLI_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  OpenCLIWatchApp:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
    dependencies:
      - target: OpenCLIWatchExtension
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(OPENCLI_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(OPENCLI_CODE_SIGN_STYLE)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(OPENCLI_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(OPENCLI_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENCLI_WATCH_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(OPENCLI_WATCH_APP_PROFILE)"
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: OpenCLI
        CFBundleShortVersionString: "$(OPENCLI_MARKETING_VERSION)"
        CFBundleVersion: "$(OPENCLI_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(OPENCLI_APP_BUNDLE_ID)"
        WKWatchKitApp: true

  OpenCLIWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchExtension/Sources
    dependencies:
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(OPENCLI_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(OPENCLI_CODE_SIGN_STYLE)"
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(OPENCLI_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(OPENCLI_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENCLI_WATCH_EXTENSION_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(OPENCLI_WATCH_EXTENSION_PROFILE)"
    info:
      path: WatchExtension/Info.plist
      properties:
        CFBundleDisplayName: OpenCLI
        CFBundleShortVersionString: "$(OPENCLI_MARKETING_VERSION)"
        CFBundleVersion: "$(OPENCLI_BUILD_VERSION)"
        NSExtension:
          NSExtensionAttributes:
            WKAppBundleIdentifier: "$(OPENCLI_WATCH_APP_BUNDLE_ID)"
          NSExtensionPointIdentifier: com.apple.watchkit

  OpenCLITests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
    dependencies:
      - target: OpenCLI
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(OPENCLI_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(OPENCLI_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.opencli.ios.tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenCLI.app/OpenCLI"
        BUNDLE_LOADER: "$(TEST_HOST)"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: OpenCLITests
        CFBundleShortVersionString: "$(OPENCLI_MARKETING_VERSION)"
        CFBundleVersion: "$(OPENCLI_BUILD_VERSION)"

  OpenCLILogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
    dependencies:
      - package: OpenCLIKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(OPENCLI_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(OPENCLI_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.opencli.ios.logic-tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_EMIT_CONST_VALUE_PROTOCOLS: ""
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: OpenCLILogicTests
        CFBundleShortVersionString: "$(OPENCLI_MARKETING_VERSION)"
        CFBundleVersion: "$(OPENCLI_BUILD_VERSION)"
